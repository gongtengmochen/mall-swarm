name: mall-backend

services:
  mysql:
    image: m.daocloud.io/docker.io/library/mysql:5.7
    restart: unless-stopped
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mall
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - type: bind
        source: .\docker\mysql\init\00-create-users.sql
        target: /docker-entrypoint-initdb.d/00-create-users.sql
        read_only: true
      - type: bind
        source: .\document\sql\mall.sql
        target: /docker-entrypoint-initdb.d/01-mall.sql
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -proot --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      default:
        aliases:
          - db

  redis:
    image: m.daocloud.io/docker.io/library/redis:7
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  mongo:
    image: m.daocloud.io/docker.io/library/mongo:4
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  rabbitmq:
    image: m.daocloud.io/docker.io/library/rabbitmq:3.9.11-management
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      RABBITMQ_DEFAULT_USER: mall
      RABBITMQ_DEFAULT_PASS: mall
      RABBITMQ_DEFAULT_VHOST: /mall
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      default:
        aliases:
          - rabbit

  nacos-registry:
    image: m.daocloud.io/docker.io/nacos/nacos-server:v2.3.0
    restart: unless-stopped
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      TZ: Asia/Shanghai
      NACOS_AUTH_ENABLE: "false"
    ports:
      - "8848:8848"
    volumes:
      - nacos-data:/home/nacos/data

  nacos-import:
    image: m.daocloud.io/docker.io/curlimages/curl:8.7.1
    restart: "no"
    depends_on:
      nacos-registry:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - tr -d '\r' < /init-nacos.sh | /bin/sh
    environment:
      NACOS_URL: http://nacos-registry:8848
    volumes:
      - type: bind
        source: .\config
        target: /configs
        read_only: true
      - type: bind
        source: .\docker\backend\init-nacos.sh
        target: /init-nacos.sh
        read_only: true

  mall-admin:
    build:
      context: .
      dockerfile: .\docker\backend\Dockerfile
      args:
        MODULE_NAME: mall-admin
    image: mall/mall-admin:docker-desktop
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Shanghai
      JAVA_OPTS: -Xms256m -Xmx512m
      LOGSTASH_HOST: localhost
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos-import:
        condition: service_completed_successfully
    volumes:
      - admin-logs:/var/logs

  mall-auth:
    build:
      context: .
      dockerfile: .\docker\backend\Dockerfile
      args:
        MODULE_NAME: mall-auth
    image: mall/mall-auth:docker-desktop
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Shanghai
      JAVA_OPTS: -Xms256m -Xmx512m
      LOGSTASH_HOST: localhost
    ports:
      - "8401:8401"
    depends_on:
      mall-admin:
        condition: service_started
      nacos-import:
        condition: service_completed_successfully
    volumes:
      - auth-logs:/var/logs

  mall-gateway:
    build:
      context: .
      dockerfile: .\docker\backend\Dockerfile
      args:
        MODULE_NAME: mall-gateway
    image: mall/mall-gateway:docker-desktop
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Shanghai
      JAVA_OPTS: -Xms256m -Xmx512m
      LOGSTASH_HOST: localhost
    ports:
      - "8201:8201"
    depends_on:
      mall-admin:
        condition: service_started
      mall-auth:
        condition: service_started
      redis:
        condition: service_healthy
      nacos-import:
        condition: service_completed_successfully
    volumes:
      - gateway-logs:/var/logs

  mall-monitor:
    build:
      context: .
      dockerfile: .\docker\backend\Dockerfile
      args:
        MODULE_NAME: mall-monitor
    image: mall/mall-monitor:docker-desktop
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Shanghai
      JAVA_OPTS: -Xms256m -Xmx512m
      LOGSTASH_HOST: localhost
    ports:
      - "8101:8101"
    depends_on:
      nacos-import:
        condition: service_completed_successfully
    volumes:
      - monitor-logs:/var/logs

  mall-portal:
    build:
      context: .
      dockerfile: .\docker\backend\Dockerfile
      args:
        MODULE_NAME: mall-portal
    image: mall/mall-portal:docker-desktop
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Shanghai
      JAVA_OPTS: -Xms256m -Xmx512m
      LOGSTASH_HOST: localhost
    ports:
      - "8085:8085"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_started
      rabbitmq:
        condition: service_started
      nacos-import:
        condition: service_completed_successfully
    volumes:
      - portal-logs:/var/logs

volumes:
  mysql-data:
  redis-data:
  mongo-data:
  rabbitmq-data:
  nacos-data:
  admin-logs:
  auth-logs:
  gateway-logs:
  monitor-logs:
  portal-logs:
