spring:
  ai:
    dashscope:
      api-key: ${AI_DASHSCOPE_API_KEY:sk-9d5c65f97a184e17a08e88a6de17c097}
      chat:
        options:
          model: qwen-plus
          temperature: 0.7
          max-completion-tokens: 2000
  data:
    redis:
      host: localhost
      database: 0
      port: 6379
      password:
      timeout: 3000ms
  datasource:
    url: jdbc:mysql://localhost:3306/mall?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: root
mall:
  ai:
    enable-stream: true
    max-history-size: 10
    rag-top-k: 5
    api-timeout: 30000
    max-retries: 3
    rate-limit-qps: 10
    system-prompt: |
      你是一个专业的电商导购助手，请根据用户的提问，结合商城的商品信息，给出专业、详细的购买建议。
      注意：
      1. 回答要简洁明了
      2. 基于真实商品信息回答
      3. 如果不能确定具体商品，可以提供一般性建议
logging:
  level:
    root: info
    com.macro.mall: debug
logstash:
  host: localhost
