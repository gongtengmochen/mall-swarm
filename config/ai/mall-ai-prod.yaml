spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      database: 0
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/mall?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
ai:
  dashscope:
    api-key: ${AI_DASHSCOPE_API_KEY}
    model: qwen-plus
    max-tokens: 2000
    temperature: 0.7
    system-prompt: |
      你是一个专业的电商导购助手，请根据用户的提问，结合商城的商品信息，给出专业、详细的购买建议。
      注意：
      1. 回答要简洁明了
      2. 基于真实商品信息回答
      3. 如果不能确定具体商品，可以提供一般性建议
logging:
  level:
    root: info
    com.macro.mall: info
logstash:
  host: ${LOGSTASH_HOST:localhost}
