services:
  mysql:
    image: mysql:5.7
    container_name: mysql
    command: mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - 3306:3306
    volumes:
      - ./mydata/mysql/data/db:/var/lib/mysql
      - ./mydata/mysql/data/conf:/etc/mysql/conf.d
      - ./mydata/mysql/log:/var/log/mysql

  redis:
    image: redis:7
    container_name: redis
    command: redis-server --appendonly yes
    volumes:
      - ./mydata/redis/data:/data
      - ./mydata/redis/log:/var/log/redis
    ports:
      - 6379:6379
    restart: always

  nginx:
    image: nginx:1.22
    container_name: nginx
    volumes:
      # 修正挂载方式：不覆盖整个nginx配置目录，避免启动失败
      - ./mydata/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./mydata/nginx/conf.d:/etc/nginx/conf.d
      - ./mydata/nginx/html:/usr/share/nginx/html
      - ./mydata/nginx/conf:/etc/nginx/conf.d
      - ./mydata/nginx/log:/var/log/nginx
    ports:
      - 81:80
    restart: always

  rabbitmq:
    image: rabbitmq:3.9.11-management
    container_name: rabbitmq
    volumes:
      - ./mydata/rabbitmq/data:/var/lib/rabbitmq
      - ./mydata/rabbitmq/log:/var/log/rabbitmq
    ports:
      - 5672:5672
      - 15672:15672
    restart: always

  elasticsearch:
    image: elasticsearch:7.17.3
    container_name: elasticsearch
    user: root
    environment:
      - cluster.name=elasticsearch
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx1024m
    volumes:
      - ./mydata/elasticsearch/plugins:/usr/share/elasticsearch/plugins
      - ./mydata/elasticsearch/data:/usr/share/elasticsearch/data
      - ./mydata/elasticsearch/log:/usr/share/elasticsearch/logs
    ports:
      - 9200:9200
      - 9300:9300
    restart: always

  logstash:
    image: logstash:7.17.3
    container_name: logstash
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./mydata/logstash/data:/usr/share/logstash/data
      - ./mydata/logstash/log:/usr/share/logstash/logs
      - ./mydata/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf #挂载logstash的配置文件
    depends_on:
      - elasticsearch
    links:
      - elasticsearch:es
    ports:
      - 4560:4560
      - 4561:4561
      - 4562:4562
      - 4563:4563
    restart: always

  kibana:
    image: kibana:7.17.3
    container_name: kibana
    volumes:
      - ./mydata/kibana/data:/usr/share/kibana/data
      - ./mydata/kibana/log:/usr/share/kibana/logs
    links:
      - elasticsearch:es
    depends_on:
      - elasticsearch
    environment:
      - elasticsearch.hosts=http://es:9200
    ports:
      - 5601:5601
    restart: always

  mongo:
    image: mongo:4
    container_name: mongo
    volumes:
      - ./mydata/mongo/db:/data/db
      - ./mydata/mongo/log:/var/log/mongodb
    ports:
      - 27017:27017
    restart: always

  nacos-registry:
    image: nacos/nacos-server:v2.1.0
    container_name: nacos-registry
    environment:
      - "MODE=standalone"
    volumes:
      - ./mydata/nacos/data:/home/nacos/data
      - ./mydata/nacos/log:/home/nacos/logs
    ports:
      - 8848:8848
      - 9848:9848
      - 9849:9849
    restart: always

  minio:
    image: minio/minio:RELEASE.2022-12-07T00-56-37Z
    container_name: minio
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - ./mydata/minio/data:/data
    ports:
      - 9000:9000
      - 9001:9001
    command: server /data --console-address ":9001"
    restart: always